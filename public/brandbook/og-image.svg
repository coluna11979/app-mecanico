<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="MecânicoApp Brandbook">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1117"/>
      <stop offset="100%" stop-color="#151C24"/>
    </linearGradient>
    <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF7A38"/>
      <stop offset="100%" stop-color="#E64500"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0%" stop-color="#FF5C0A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF5C0A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo -->
  <g transform="translate(80, 80)">
    <rect width="96" height="96" rx="21" fill="#0B1117" stroke="#FF5C0A" stroke-opacity="0.25"/>
    <g transform="translate(16, 16) scale(1)">
      <path fill="url(#logo-grad)" d="M32 10c-7.2 0-13 5.8-13 13 0 4.6 2.4 8.6 6 10.9V50a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3V33.9c3.6-2.3 6-6.3 6-10.9 0-7.2-5.8-13-13-13Zm0 6.5a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13Z"/>
      <circle cx="32" cy="23" r="3" fill="#0B1117"/>
    </g>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="280" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="600" fill="#FF5C0A" letter-spacing="3">BRANDBOOK · v1.0</text>

  <!-- Title -->
  <text x="80" y="370" font-family="'Space Grotesk', sans-serif" font-size="88" font-weight="700" fill="#F5F7FA" letter-spacing="-2">
    Mecânico<tspan fill="#FF5C0A">App</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="440" font-family="'Inter', sans-serif" font-size="28" font-weight="400" fill="rgba(245,247,250,0.65)">Guia oficial de identidade visual e tom de voz.</text>

  <!-- Footer -->
  <text x="80" y="560" font-family="'JetBrains Mono', monospace" font-size="16" fill="rgba(245,247,250,0.45)">mecanicoapp.com.br/brandbook</text>

  <!-- Right side accent block -->
  <g transform="translate(880, 200)">
    <rect width="240" height="240" rx="20" fill="#FF5C0A"/>
    <text x="120" y="115" font-family="'Space Grotesk', sans-serif" font-size="56" font-weight="700" fill="#fff" text-anchor="middle">B2B</text>
    <text x="120" y="155" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.85)" text-anchor="middle">Brasil 🇧🇷</text>
  </g>
</svg>
